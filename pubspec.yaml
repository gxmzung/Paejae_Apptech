name: apptech_flutter
description: Paejae University themed AppTech prototype
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.5

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0

  http: ^1.2.2
  html: ^0.15.4
  crypto: ^3.0.3

  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1

  pedometer: ^4.0.1

  home_widget: ^0.6.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  excel: ^4.0.2

  google_maps_flutter: ^2.6.0
  webview_flutter: ^4.8.0

  mobile_scanner: ^7.2.0

  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_commons: ^0.11.1

  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/brand/
    - assets/data/
    - assets/data/lectures.xlsx
    - assets/icon/app_icon.png
    - assets/icons/nasom.gif
    - assets/images/
    - assets/intro/
    - assets/knowledge/
    - assets/timesnap/
    - assets/timetable/courses.json